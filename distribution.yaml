name: donna
version: 2.0.0-rc.1
description: >
  Whole-life executive assistant and specialist orchestrator. Includes explicit
  planning and acceptance procedures, a bounded coordination toolkit, a
  conflict-aware Obsidian projection, and native Hermes Kanban/cron integration.
  Release candidate: offline tests are distinct from live installation acceptance.
hermes_requires: ">=0.14.0"
author: Unsu Labs
license: MIT
homepage: https://github.com/unsulabs/donna
env_vars:
  - name: DONNA_OPS_CONFIG
    description: Absolute path to private donna-ops.json; defaults to HERMES_HOME/donna-ops.json
    required: false
  - name: OBSIDIAN_VAULT_PATH
    description: Existing approved vault path, also used by bundled Obsidian skills
    required: false
  - name: MNEMOSYNE_DATA_DIR
    description: Optional existing profile-scoped memory provider data
    required: false
  - name: TELEGRAM_BOT_TOKEN
    description: Optional account credential; configure privately, never in this repository
    required: false
distribution_owned:
  - SOUL.md
  - AGENTS.md
  - config.yaml
  - README.md
  - LICENSE
  - distribution.yaml
  - profile.yaml
  - .team.example
  - .env.example
  - skills/donna-session/
  - skills/donna-planning/
  - skills/donna-team-orchestration/
  - skills/donna-operational-review/
  - skills/donna-team-development/
  - skills/donna-setup/
  - scripts/donna_migrate_team.py
  - scripts/donna_ops.py
  - scripts/donna_review_gate.py
  - scripts/donna_runtime/
  - scripts/kanban_board_notify.py
  - scripts/scaffold_vault.py
  - scripts/config_guard.py
  - docs/
  - examples/
  - assets/
  - skins/
# Runtime .team, donna-ops.json, donna-state and memories are NEVER distribution-owned.
# The version floor is inherited; doctor --native + live acceptance, not the number
# alone, determine compatibility with required public CLI contracts.
