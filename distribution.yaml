name: donna
version: 1.0.0
description: >
  Executive-assistant Hermes profile (Donna): perceptive, discreet, outcome-focused.
  Ships persona + operating doctrine, full-stack guided onboarding (Mnemosyne memory,
  PARA Obsidian vault, daily briefing, TTS, optional Google/Telegram), and a clean
  vault starter. No credentials, model pins, or personal data — runs on the recipient's
  own Hermes model/provider.
hermes_requires: ">=0.14.0"
author: Unsu Labs
license: MIT
homepage: https://github.com/unsulabs/donna
# Env vars listed for install-time checklist. None are required to install;
# model auth is via hermes setup / existing profile keys.
env_vars:
  - name: OBSIDIAN_VAULT_PATH
    description: Absolute path to this profile's Obsidian vault (set by onboarding)
    required: false
  - name: MNEMOSYNE_DATA_DIR
    description: Absolute path to profile-scoped Mnemosyne SQLite data dir
    required: false
  - name: MNEMOSYNE_HOST_LLM_ENABLED
    description: Use Hermes host LLM for Mnemosyne consolidation (recommended true)
    required: false
    default: "true"
  - name: TELEGRAM_BOT_TOKEN
    description: Telegram bot token (optional messaging)
    required: false
  - name: TELEGRAM_ALLOWED_USERS
    description: Comma-separated Telegram user IDs allowed to talk to the bot
    required: false
distribution_owned:
  - SOUL.md
  - AGENTS.md
  - config.yaml
  - README.md
  - LICENSE
  - distribution.yaml
  - profile.yaml
  - skills/
  - scripts/
  - assets/
  - skins/
  - memories/
  - .env.example
