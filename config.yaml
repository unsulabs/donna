# FRESH INSTALL DEFAULTS ONLY. Existing installations preserve their own config.
# Donna-specific settings live in private donna-ops.json, not invented Hermes keys.
agent:
  max_turns: 60
  api_max_retries: 3
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  coding_context: auto
  reasoning_effort: high
compression:
  enabled: true
  threshold: 0.85
  target_ratio: 0.70
  protect_last_n: 50
  protect_first_n: 3
  abort_on_summary_failure: false
display:
  compact: true
  personality: helpful
  show_reasoning: false
  streaming: true
  timestamps: false
  persistent_output: true
  persist_prompts: true
  file_mutation_verifier: true
  skin: donna
  tool_progress: new
privacy:
  redact_pii: true
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true
  memory_char_limit: 1100
  user_char_limit: 700
  auto_sleep: false
  # Preserve an installed provider. New optional Mnemosyne setup is consent-based.
skills:
  template_vars: true
  inline_shell: false
  guard_agent_created: true
  write_approval: true
approvals:
  mode: manual
  timeout: 60
  cron_mode: deny
# No blanket heredoc / -c bypass. Configure narrow approved script access locally.
command_allowlist: []
security:
  allow_private_urls: false
  redact_secrets: true
  website_blocklist:
    enabled: false
    domains: []
kanban:
  dispatch_in_gateway: false
  # auto_decompose must be reviewed on the actual dispatcher host, not guessed here.
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3
  memory_monitor:
    enabled: true
onboarding:
  profile_build: ask
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
  telegram:
    - hermes-telegram
    - kanban
platforms:
  api_server:
    enabled: false
  telegram:
    enabled: false
  bluebubbles:
    enabled: false
tts:
  edge:
    voice: en-US-JennyNeural
plugins:
  enabled: []
  disabled: []
  entries: {}
